<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Find a Doctor — CareFlow</title>
  <meta name="description" content="Search and find verified doctors near you. Filter by specialty, location, and availability." />
  <link rel="stylesheet" href="global.css" />
  <link rel="stylesheet" href="search.css" />
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <nav class="cf-navbar scrolled" id="navbar">
    <a href="homepage.html" class="cf-navbar-logo">
      <img src="images/Logo.png" alt="CareFlow Logo" />
    </a>
    <div class="cf-navbar-links">
      <a href="homepage.html">Home</a>
      <a href="available.html">Consult Now</a>
      <a href="contact.html">Contact</a>
      <a href="signup.html" class="cf-btn cf-btn-primary cf-btn-sm">Get Started</a>
    </div>
  </nav>

  <!-- ===== SEARCH AREA ===== -->
  <div class="search-page">
    <div class="search-hero">
      <div class="container">
        <h1 class="search-page-title">Find Your Doctor</h1>
        <div class="search-controls">
          <div class="search-main-input">
            <svg class="search-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input id="search-input" placeholder="Search for a doctor, specialty, or hospital..." autocomplete="off" />
            <span id="clear-search" class="clear-btn">✕</span>
          </div>
          <div id="suggestions" class="suggestions"></div>
          <select id="location-filter" class="location-select">
            <option value="">📍 All Locations</option>
          </select>
          <button id="filter-button" class="filter-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/></svg>
            Filters
          </button>
        </div>
      </div>
    </div>

    <!-- Filter Panel -->
    <div class="container">
      <section class="filter-section" id="specialty-filter-container" style="display: none;">
        <h3>Filter by Specialty</h3>
        <div class="specialty-filter"></div>
      </section>

      <!-- Results Bar -->
      <section class="results-bar">
        <div class="results-count-text">
          We've found <strong id="results-count">0</strong> Doctors/Providers you can book with!
        </div>
        <button id="available-now-btn" class="cf-btn cf-btn-success cf-btn-sm">
          <span class="pulse-dot-green"></span>
          Available Now
        </button>
      </section>

      <!-- Doctor Cards -->
      <section id="doctor-list" class="doctor-list"></section>
    </div>
  </div>

  <script src="search.js" type="text/javascript"></script>
  <script>
    document.getElementById('filter-button').addEventListener('click', function() {
      const container = document.getElementById('specialty-filter-container');
      container.style.display = container.style.display === 'none' ? 'block' : 'none';
    });
  </script>
</body>
</html>
